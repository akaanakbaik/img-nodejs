name: OpenSSH audit preflight (static policy only)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/openssh-audit.yml"
      - "audit/openssh106/**"
      - "README.md"

permissions:
  contents: read

jobs:
  policy-check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Enforce audit workflow no-publish boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Test workflow policy (static only)
        run: python3 -I -S audit/openssh106/ci/test_workflow_policy.py -v
