name: Build and publish Pterodactyl Node.js images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
      - egg/docker_images.json
      - scripts/**
      - versions.json
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/publish.yml
      - egg/docker_images.json
      - scripts/**
      - versions.json
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: publish-node-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/img-nodejs

jobs:
  validate-metadata:
    name: Validate metadata and resolve Node patches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      publish_matrix: ${{ steps.matrix.outputs.publish_matrix }}
      manifests: ${{ steps.matrix.outputs.manifests }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate JSON, scripts, and resolver
        run: |
          set -euo pipefail
          python3 scripts/validate_egg.py
          bash -n scripts/smoke_test_image.sh scripts/install_trivy.sh
          node scripts/test_verify_runtime.js
          node --check scripts/update_supported_npm.js
          python3 scripts/test_resolve_versions.py
          python3 scripts/test_cve_gate.py
          python3 scripts/test_os_update_policy.py
          python3 scripts/resolve_versions.py --check
          test -s versions.json
      - id: matrix
        name: Resolve exact patch matrix
        run: |
          set -euo pipefail
          resolved="$(python3 scripts/resolve_versions.py --ci-matrices)"
          printf '%s\n' "$resolved" | jq -e '.verify.include | length == 18' >/dev/null
          printf 'matrix=%s\n' "$(printf '%s' "$resolved" | jq -c '.verify')" >> "$GITHUB_OUTPUT"
          printf 'publish_matrix=%s\n' "$(printf '%s' "$resolved" | jq -c '.publish')" >> "$GITHUB_OUTPUT"
          printf 'manifests=%s\n' "$(printf '%s' "$resolved" | jq -c '.manifests')" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Node.js ${{ matrix.major }} (${{ matrix.arch }})
    needs: validate-metadata
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    # EOL findings or audit errors are reported, never publication prerequisites.
    continue-on-error: ${{ !matrix.publish }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-metadata.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve immutable multi-arch base digest
        id: base
        run: |
          set -euo pipefail
          ref="ghcr.io/parkervcp/yolks:nodejs_${{ matrix.major }}"
          # Consume the full output; early awk exit can break buildx under pipefail.
          digest="$(docker buildx imagetools inspect "$ref" | awk '/^Digest:/ {print $2}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid base digest: $digest" >&2; exit 1; }
          printf 'ref=%s@%s\n' "$ref" "$digest" >> "$GITHUB_OUTPUT"
      - name: Build exact candidate (native architecture)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          tags: local/img-nodejs:nodejs_${{ matrix.major }}-${{ matrix.arch }}
          build-args: |
            NODE_MAJOR=${{ matrix.major }}
            NODE_PATCH=${{ matrix.patch }}
            BASE_IMAGE=${{ steps.base.outputs.ref }}
            APPLY_OS_UPDATES=${{ matrix.publish }}
          cache-from: type=gha,scope=node-${{ matrix.major }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.major }}-${{ matrix.arch }}
      - name: Test runtime and Egg startup contract
        run: bash scripts/smoke_test_image.sh "${{ matrix.major }}" "${{ matrix.arch }}" "local/img-nodejs:nodejs_${{ matrix.major }}-${{ matrix.arch }}" "${{ matrix.patch }}"
      - name: Record exact candidate and Brotli linkage
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          image="local/img-nodejs:nodejs_${{ matrix.major }}-${{ matrix.arch }}"
          jq -n --arg base "$BASE_REF" --arg digest "$BUILD_DIGEST" --arg imageid "$IMAGE_ID" --arg arch "${{ matrix.arch }}" --arg patch "${{ matrix.patch }}" '{base: $base, manifest_digest: $digest, image_id: $imageid, arch: $arch, expected_node: $patch}' > candidate-metadata.json
          docker run --rm --entrypoint /bin/sh "$image" -ec 'node --version; sha256sum /usr/local/bin/node; ldd /usr/local/bin/node; readelf -d /usr/local/bin/node; node -p "JSON.stringify({node:process.versions.node,brotli:process.versions.brotli,sharedBrotli:process.config.variables.node_shared_brotli})"; dpkg-query -W libbrotli1; node -e '\''require("zlib").brotliCompressSync(Buffer.from("test"));console.log(process.report.getReport().sharedObjects.join("\n"))'\''' > brotli-linkage.txt
      - name: Install pinned Trivy
        run: sudo TRIVY_BIN=/usr/local/bin/trivy bash scripts/install_trivy.sh
      - name: Scan image and repository
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --output "trivy-image-${{ matrix.major }}-${{ matrix.arch }}.json" "local/img-nodejs:nodejs_${{ matrix.major }}-${{ matrix.arch }}"
          trivy image --scanners vuln --format cyclonedx --output "trivy-sbom-${{ matrix.major }}-${{ matrix.arch }}.json" "local/img-nodejs:nodejs_${{ matrix.major }}-${{ matrix.arch }}"
          trivy fs --scanners vuln,secret,misconfig --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --format json --output "trivy-repo-${{ matrix.major }}-${{ matrix.arch }}.json" .
          trivy --version --format json > scanner-metadata.json
      - name: Audit system Brotli consumers with benign input
        if: matrix.publish
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash --mount "type=bind,src=$PWD/scripts,dst=/audit,readonly" "local/img-nodejs:nodejs_${{ matrix.major }}-${{ matrix.arch }}" /audit/audit_brotli_consumers.sh > brotli-consumers.txt 2>&1
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-${{ matrix.major }}-${{ matrix.arch }}
          path: |
            trivy-*.json
            candidate-metadata.json
            brotli-linkage.txt
            brotli-consumers.txt
            scanner-metadata.json
          if-no-files-found: warn
      - name: Block CVE-2026-111497 at every severity
        if: matrix.publish
        run: |
          set -euo pipefail
          report="trivy-image-${{ matrix.major }}-${{ matrix.arch }}.json"
          test -s "$report"
          jq -e 'type == "object" and (.Results | type == "array")' "$report" >/dev/null
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.VulnerabilityID == "CVE-2026-111497")] | length == 0' "$report" >/dev/null
      - name: Enforce vulnerability and repository security gates
        id: gate
        if: matrix.publish
        run: |
          set -euo pipefail
          image_report="trivy-image-${{ matrix.major }}-${{ matrix.arch }}.json"
          repo_report="trivy-repo-${{ matrix.major }}-${{ matrix.arch }}.json"
          test -s "$image_report"
          test -s "$repo_report"
          jq -e 'type == "object" and (.Results | type == "array")' "$image_report" >/dev/null
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' "$image_report" >/dev/null
          jq -e 'type == "object" and (.Results | type == "array")' "$repo_report" >/dev/null
          jq -e '[.Results[]? | (.Vulnerabilities[]?, .Misconfigurations[]?, .Secrets[]?) | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' "$repo_report" >/dev/null
      - name: Save exact tested image
        id: save
        if: steps.gate.outcome == 'success'
        run: docker save "local/img-nodejs:nodejs_${{ matrix.major }}-${{ matrix.arch }}" | gzip -1 > "image-${{ matrix.major }}-${{ matrix.arch }}.tar.gz"
      - name: Upload exact tested image
        if: steps.save.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-${{ matrix.major }}-${{ matrix.arch }}
          path: image-${{ matrix.major }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish-arch:
    name: Publish tested arch Node.js ${{ matrix.major }} (${{ matrix.arch }})
    needs: [validate-metadata, verify]
    if: github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-metadata.outputs.publish_matrix) }}
    steps:
      - name: Download exact tested image
        if: matrix.publish
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tested-${{ matrix.major }}-${{ matrix.arch }}
      - name: Load and push immutable architecture candidate
        id: push
        if: matrix.publish
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          STAGE: nodejs_${{ matrix.major }}-${{ matrix.arch }}-${{ github.sha }}
        run: |
          set -euo pipefail
          gunzip -c "image-${{ matrix.major }}-${{ matrix.arch }}.tar.gz" | docker load
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker tag "local/img-nodejs:nodejs_${{ matrix.major }}-${{ matrix.arch }}" "$IMAGE:$STAGE"
          docker push "$IMAGE:$STAGE"
          docker inspect --format='digest={{index .RepoDigests 0}}' "$IMAGE:$STAGE" > "digest-${{ matrix.major }}-${{ matrix.arch }}.txt"
      - name: Upload pushed digest record
        if: steps.push.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pushed-${{ matrix.major }}-${{ matrix.arch }}
          path: digest-${{ matrix.major }}-${{ matrix.arch }}.txt

  publish-manifest:
    name: Publish final multi-arch Node.js ${{ matrix.major }}
    needs: [validate-metadata, publish-arch]
    if: github.ref == 'refs/heads/main' && needs.publish-arch.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.validate-metadata.outputs.manifests) }}
    steps:
      - name: Download pushed digests
        if: matrix.publish
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pushed-${{ matrix.major }}-*
          merge-multiple: true
      - name: Create final multi-arch tag from pushed digests
        if: matrix.publish
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          amd="$(cut -d= -f2 "digest-${{ matrix.major }}-amd64.txt")"
          arm="$(cut -d= -f2 "digest-${{ matrix.major }}-arm64.txt")"
          [[ "$amd" =~ ^${IMAGE}@sha256:[0-9a-f]{64}$ ]] || { echo "invalid amd64 digest record" >&2; exit 1; }
          [[ "$arm" =~ ^${IMAGE}@sha256:[0-9a-f]{64}$ ]] || { echo "invalid arm64 digest record" >&2; exit 1; }
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "$IMAGE:nodejs_${{ matrix.major }}" "$amd" "$arm"
