name: Build and publish Pterodactyl Node.js images

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-node-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "19", "20", "21", "22", "23", "24", "25", "26"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NODE_VERSION=${{ matrix.node }}
          tags: ghcr.io/${{ github.repository_owner }}/img-nodejs:nodejs_${{ matrix.node }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Pterodactyl Node.js ${{ matrix.node }}
            org.opencontainers.image.version=${{ matrix.node }}
          cache-from: type=gha,scope=node-${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node }}
