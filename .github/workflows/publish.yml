name: Build and publish Pterodactyl Node.js images

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/publish.yml"
      - "egg/docker_images.json"
      - "scripts/**"
  workflow_dispatch:
  schedule:
    # Weekly; intentionally not scheduled at the top of the hour.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: publish-node-images
  cancel-in-progress: false

jobs:
  validate-metadata:
    name: Validate Egg image mapping
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Validate JSON and smoke-test script syntax
        run: |
          python3 scripts/validate_egg.py
          bash -n scripts/smoke_test_image.sh

  smoke-test:
    name: Smoke test Node.js ${{ matrix.node }} (${{ matrix.arch }})
    needs: validate-metadata
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "19", "20", "21", "22", "23", "24", "25", "26"]
        arch: ["amd64", "arm64"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1, Node 24
      - name: Build candidate image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0, Node 24
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          tags: local/img-nodejs:nodejs_${{ matrix.node }}-${{ matrix.arch }}
          build-args: |
            NODE_VERSION=${{ matrix.node }}
          cache-from: type=gha,scope=node-${{ matrix.node }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node }}-${{ matrix.arch }}
      - name: Test Pterodactyl container contract and Egg startup fixture
        run: bash scripts/smoke_test_image.sh "${{ matrix.node }}" "${{ matrix.arch }}" "local/img-nodejs:nodejs_${{ matrix.node }}-${{ matrix.arch }}"

  publish:
    name: Publish multi-platform Node.js ${{ matrix.node }}
    needs: smoke-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "19", "20", "21", "22", "23", "24", "25", "26"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1, Node 24
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0, Node 24
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish tested image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0, Node 24
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            NODE_VERSION=${{ matrix.node }}
          tags: ghcr.io/${{ github.repository_owner }}/img-nodejs:nodejs_${{ matrix.node }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Pterodactyl Node.js ${{ matrix.node }}
            org.opencontainers.image.version=${{ matrix.node }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=node-${{ matrix.node }}-multiarch
          cache-to: type=gha,mode=max,scope=node-${{ matrix.node }}-multiarch
